spring:
  application:
    name: pilo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pilo}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:50}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE:2}
    max-http-form-post-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

pilo:
  jwt:
    secret: ${PILO_JWT_SECRET:dev-only-change-me-to-a-256-bit-secret-key!!}
    previous-secret: ${PILO_JWT_PREVIOUS_SECRET:}
    expiration: ${PILO_JWT_EXPIRATION:24h}
    issuer: ${PILO_JWT_ISSUER:pilo}
    audience: ${PILO_JWT_AUDIENCE:pilo-api}
  cors:
    allowed-origins: ${PILO_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
  seed:
    enabled: false
  storage:
    provider: ${PILO_STORAGE_PROVIDER:local}
    local-path: ${PILO_STORAGE_PATH:./storage}
    bucket: ${PILO_S3_BUCKET:}
    region: ${AWS_REGION:eu-west-1}
    endpoint: ${PILO_S3_ENDPOINT:}
    presigned-url-expiration: ${PILO_PRESIGNED_URL_EXPIRATION:15m}
  processing:
    mode: ${PILO_PROCESSING_MODE:inline}
  ai:
    provider: ${PILO_AI_PROVIDER:mock}
    gemini-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    min-confidence: 0.5
  internal:
    api-key: ${PILO_INTERNAL_API_KEY:dev-internal-key}
  integrations:
    demo-fallback-enabled: ${PILO_INTEGRATIONS_DEMO_FALLBACK:true}
    timeout: ${PILO_INTEGRATIONS_TIMEOUT:4s}
    max-query-length: 120

---
spring:
  config:
    activate:
      on-profile: local
pilo:
  seed:
    enabled: true
  storage:
    provider: local
  processing:
    mode: inline
  ai:
    provider: ${PILO_AI_PROVIDER:mock}

---
spring:
  config:
    activate:
      on-profile: aws
  datasource:
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:1}
server:
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:20}
      min-spare: 2
pilo:
  seed:
    enabled: ${PILO_SEED_ENABLED:false}
  storage:
    provider: s3
  processing:
    mode: external
  jwt:
    expiration: ${PILO_JWT_EXPIRATION:2h}
  integrations:
    demo-fallback-enabled: ${PILO_INTEGRATIONS_DEMO_FALLBACK:false}
