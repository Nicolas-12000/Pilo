spring:
  application:
    name: pilo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pilo}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

pilo:
  jwt:
    secret: ${PILO_JWT_SECRET:dev-only-change-me-to-a-256-bit-secret-key!!}
    expiration: ${PILO_JWT_EXPIRATION:24h}
  cors:
    allowed-origins: ${PILO_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  seed:
    enabled: false
  storage:
    local-path: ${PILO_STORAGE_PATH:./storage}
  ai:
    gemini-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    min-confidence: 0.5
  internal:
    api-key: ${PILO_INTERNAL_API_KEY:dev-internal-key}

---
spring:
  config:
    activate:
      on-profile: local
pilo:
  seed:
    enabled: true
