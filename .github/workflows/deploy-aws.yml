name: deploy-aws

on:
  push:
    branches: [main]
    paths:
      - "pilo-backend/**"
      - "pilo-worker/**"
      - "docker-compose.ec2.yml"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: all
        options: [all, backend, worker]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  AWS_ROLE: arn:aws:iam::944036658538:role/pilo-github-actions
  LAMBDA_NAME: pilo-document-processor-dev

jobs:
  worker:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'worker'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pilo-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build zip and update Lambda
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          aws lambda update-function-code \
            --function-name "$LAMBDA_NAME" \
            --zip-file fileb://dist/pilo-document-processor.zip

  backend:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Rebuild backend on EC2 via SSM
        run: |
          set -euo pipefail
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=pilo-api Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "No running EC2 tagged Name=pilo-api. Start it with scripts/aws/start-demo.sh"
            exit 1
          fi
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 3600 \
            --comment "pilo-backend deploy ${GITHUB_SHA}" \
            --parameters commands='["/usr/local/bin/pilo-update.sh"]' \
            --query Command.CommandId --output text)"
          echo "SSM command $COMMAND_ID on $INSTANCE_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          STATUS="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
          test "$STATUS" = "Success"
