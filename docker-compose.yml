# Optional local PostgreSQL for teammates or a clean machine.
# If you already run Postgres in Docker, skip this file and point the
# backend at that instance with SPRING_DATASOURCE_* (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: pilo-postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pilo}
      POSTGRES_USER: ${POSTGRES_USER:-pilo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pilo}
    volumes:
      - pilo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilo -d pilo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pilo_pgdata:
