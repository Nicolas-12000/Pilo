# Backend only — for the EC2 t4g.micro. Do NOT start docker-compose.yml
# (that file is local Postgres; production DB is RDS).
#
# Tag each build so Friday rollback is `PILO_IMAGE_TAG=previous`.
#   TAG=$(git rev-parse --short HEAD)
#   PILO_IMAGE_TAG=$TAG docker compose -f docker-compose.ec2.yml up -d --build
#   docker tag pilo-backend:$TAG pilo-backend:previous
# Rollback (no rebuild):
#   PILO_IMAGE_TAG=previous docker compose -f docker-compose.ec2.yml up -d --no-build
#
# Bind 127.0.0.1:8080 so nginx on the host can proxy :80. Spring listens on
# 0.0.0.0 inside the container.

services:
  backend:
    build:
      context: ./pilo-backend
    image: pilo-backend:${PILO_IMAGE_TAG:-ec2}
    container_name: pilo-backend
    env_file:
      - .env.aws
    environment:
      SPRING_PROFILES_ACTIVE: aws
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 90s
